[package]
name = "cdp-browser-lite"
version = "0.3.2"
edition = "2024"
description = "Control total del ciclo de vida de instancias de Chrome y acceso CDP"
repository = "https://github.com/raultov/cdp-browser-lite"
license = "MIT"
keywords = ["cdp", "chrome", "browser", "automation", "headless"]
categories = ["web-programming"]

[features]
# Re-exports the in-process DevTools HTTP/WS mocks under
# `cdp_browser_lite::test_support` for downstream integration tests.
# Pulls in `tokio-tungstenite` and `futures-util` as transitive deps.
test-support = ["dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
cdp-lite = "0.2.0"
tokio = { version = "1", features = ["process", "net", "time", "fs", "io-util", "sync", "macros", "rt-multi-thread", "signal"] }
thiserror = "2"
tracing = "0.1"
serde_json = "1"
tempfile = "3"
tokio-tungstenite = { version = "0.30", optional = true }
futures-util = { version = "0.3", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal"] }

[dev-dependencies]
tokio-stream = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Integration tests that exercise the public DevTools mocks under
# `cdp_browser_lite::test_support`. They are only built when the
# `test-support` feature is enabled (matches the dependency surface the
# mocks need).
[[test]]
name = "browser_lifecycle"
path = "tests/browser_lifecycle.rs"
required-features = ["test-support"]

[[test]]
name = "client_access"
path = "tests/client_access.rs"
required-features = ["test-support"]

[[test]]
name = "drop_semantics"
path = "tests/drop_semantics.rs"
required-features = ["test-support"]

[[test]]
name = "mock_fidelity"
path = "tests/mock_fidelity.rs"
required-features = ["test-support"]

[[test]]
name = "multi_tab"
path = "tests/multi_tab.rs"
required-features = ["test-support"]

[[test]]
name = "pool"
path = "tests/pool.rs"
required-features = ["test-support"]

[[test]]
name = "probe_tests"
path = "tests/probe_tests.rs"
required-features = ["test-support"]

[[test]]
name = "profile_per_port"
path = "tests/profile_per_port.rs"
required-features = ["test-support"]

[[bin]]
name = "fake_chrome_helper"
path = "src/bin/fake_chrome_helper.rs"

[lints.clippy]
# Enforce strict complexity limits
cognitive_complexity = "warn" # or "deny" to break the build
type_complexity = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
large_enum_variant = "warn"

# Automatically deny stylistic nesting issues
collapsible_if = "deny"
collapsible_match = "deny"
